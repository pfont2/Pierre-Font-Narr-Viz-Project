<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Global Energy & Climate Pivot</title>

    <!-- D3 Library (v5) -->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <!-- d3-annotation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        #container {
            width: 960px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .nav-buttons {
            margin: 20px 0 10px 0;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 5px;
            background: #e0e0e0;
            border: 1px solid #999;
            border-radius: 4px;
        }
        button.active {
            background: #007bff;
            color: white;
            border-color: #0056b3;
            font-weight: bold;
        }
        #hint {
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin: 0 0 10px 0;
        }
        #chart-container {
            width: 920px;
            height: 560px;
            position: relative;
        }
        /* Style for SVG Elements */
        path.line-path {
            fill: none !important;
            stroke-width: 2.5px;
        }
        .legend-box {
            stroke: none !important;
        }
        .bar-rect {
            stroke: #333;
            stroke-width: 0.5px;
        }

        /* ANNOTATION TEMPLATE: identical styling in every scene */
        .annotation-group .annotation-note-label {
            font-size: 10px;
            line-height: 1.25;
        }
        .annotation-group .annotation-note-title {
            font-size: 11px;
            font-weight: bold;
        }
        .annotation-group .annotation-note-bg {
            fill: #ffffff;
            fill-opacity: 0.95;
            stroke: #444;
            stroke-width: 0.75px;
        }
        .annotation-group .connector {
            stroke: #444;
            stroke-width: 1.25px;
            stroke-dasharray: 3, 3;
        }
        .annotation-group .annotation-subject {
            stroke: #444;
        }

        circle {
            stroke: black;
            opacity: 0.8;
        }
        /* Simple Tooltip Styling for Scene 3 */
        .tooltip {
            position: absolute;
            padding: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            max-width: 220px;
            z-index: 10;
        }
    </style>
</head>

<body onload="init()">
<div id="container">
    <h1 id="scene-title">The Global Energy & Climate Pivot</h1>
    <p id="scene-description">Loading project data...</p>

    <!-- Triggers (Navigation Buttons) -->
    <div class="nav-buttons">
        <button id="btn-1" class="active" onclick="goToScene(1)">1. Renewable Trends</button>
        <button id="btn-2" onclick="goToScene(2)">2. CO2 Emissions Leaders</button>
        <button id="btn-3" onclick="goToScene(3)">3. Efficiency vs. Renewables</button>
    </div>
    <p id="hint"></p>

    <!-- Chart SVG Container -->
    <div id="chart-container">
        <div id="tooltip" class="tooltip"></div>
    </div>
</div>

<script>
    // PARAMETERS (State Variables)
    var currentScene = 1;

    // Data Storage Variables
    var data1_region = [];
    var data1_income = [];
    var data2_bars = [];
    var data3_scatter = [];

    // Main SVG Canvas & Dimensions
    // The right margin is deliberately wide: it is the reserved "gutter" that
    // holds the legends so they never sit on top of the plotted data.
    var svgWidth = 920;
    var svgHeight = 560;
    var margin = {top: 30, right: 220, bottom: 50, left: 60};
    var width = svgWidth - margin.left - margin.right;   // 640
    var height = svgHeight - margin.top - margin.bottom; // 480

    // HEADROOM: every y-scale is padded above the maximum data value so that a
    // blank band is guaranteed at the top of each chart for the annotation.
    var headroom = 1.65;

    // SHARED COLOR SCALES: the domains are listed explicitly so that a region
    // (or income group) keeps the SAME color in every scene. Letting d3 assign
    // colors in data order made Scene 1 and Scene 3 disagree.
    // The two spellings of the Middle East region deliberately share one color.
    var regionColor = d3.scaleOrdinal()
        .domain([
            "East Asia & Pacific",
            "Europe & Central Asia",
            "Latin America & Caribbean",
            "Middle East & North Africa",
            "Middle East, North Africa, Afghanistan & Pakistan",
            "North America",
            "South Asia",
            "Sub-Saharan Africa"
        ])
        .range([
            "#4e79a7",
            "#f28e2b",
            "#59a14f",
            "#e15759",
            "#e15759",
            "#b07aa1",
            "#9c755f",
            "#76b7b2"
        ]);

    var incomeColor = d3.scaleOrdinal()
        .domain([
            "High income",
            "Upper middle income",
            "Lower middle income",
            "Low income"
        ])
        .range([
            "#2f6f9f",
            "#e28e2c",
            "#59a14f",
            "#b07aa1"
        ]);

    var svg = d3.select("#chart-container")
        .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
        .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var tooltip = d3.select("#tooltip");

    // HELPER FUNCTION: Safely reads object properties ignoring hidden BOM characters
    function getVal(d, keyName) {
        var keys = Object.keys(d);
        for (var i = 0; i < keys.length; i++) {
            if (keys[i].trim().replace(/^\ufeff/, "") === keyName) {
                return d[keys[i]];
            }
        }
        return d[keyName];
    }

    // HELPER FUNCTION: keeps one very long region name from overflowing the legend
    function shortName(name) {
        if (name === "Middle East, North Africa, Afghanistan & Pakistan") {
            return "Middle East, N. Africa, Afg. & Pak.";
        }
        return name;
    }

    // ANNOTATION TEMPLATE: every scene builds its annotation through this one
    // function, so type, class and styling are identical from scene to scene.
    function drawAnnotation(parentGroup, annotationArray) {
        var maker = d3.annotation()
            .type(d3.annotationCalloutElbow)
            .annotations(annotationArray);

        parentGroup.append("g")
            .attr("class", "annotation-group")
            .call(maker);
    }

    // TOOLTIP HELPER: positions the tooltip relative to the chart container.
    // (d3.event.offsetX is measured against the hovered SVG shape, not the
    // container, which is why the tooltip used to appear in the wrong place.)
    function moveTooltip() {
        var container = d3.select("#chart-container").node();
        var point = d3.mouse(container);
        var left = point[0] + 15;
        var top = point[1] - 10;

        if (left > svgWidth - 230) {
            left = point[0] - 235;
        }
        if (top < 0) {
            top = 0;
        }

        tooltip.style("left", left + "px").style("top", top + "px");
    }

    // INITIALIZATION FUNCTION: Loads CSV files safely
    async function init() {
        data1_region = await d3.csv("scene1_lines1.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                year: +getVal(d, "Year"),
                value: +getVal(d, "renewable_pct")
            };
        });

        data1_income = await d3.csv("scene1_lines2.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                year: +getVal(d, "Year"),
                value: +getVal(d, "renewable_pct")
            };
        });

        data2_bars = await d3.csv("scene2_bars.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                value: +getVal(d, "Value"),
                region: getVal(d, "Region"),
                income: (getVal(d, "Income Group") || "").trim()
            };
        });

        data3_scatter = await d3.csv("scene3_scatter.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                year: +getVal(d, "Year"),
                renewable_pct: Math.max(0, +getVal(d, "renewable_pct")),
                gdp_per_energy: +getVal(d, "gdp_per_energy"),
                region: getVal(d, "Region"),
                income: (getVal(d, "Income Group") || "").trim()
            };
        });

        renderScene();
    }

    // TRIGGER FUNCTION: Updates parameter & UI state
    function goToScene(sceneNumber) {
        currentScene = sceneNumber;

        d3.selectAll(".nav-buttons button").classed("active", false);
        d3.select("#btn-" + sceneNumber).classed("active", true);

        renderScene();
    }

    // MAIN CONTROLLER FUNCTION
    function renderScene() {
        svg.selectAll("*").remove();
        tooltip.style("opacity", 0);

        if (currentScene === 1) {
            renderScene1();
        } else if (currentScene === 2) {
            renderScene2();
        } else if (currentScene === 3) {
            renderScene3();
        }
    }

    // ==========================================
    // SCENE 1: RENEWABLE ADOPTION TRENDS
    // ==========================================
    function renderScene1() {
        d3.select("#scene-title").text("Scene 1: Renewable Electricity Adoption (1990-2021)");
        d3.select("#scene-description").text(
            "Global renewable energy adoption (excluding hydro) has expanded significantly, led rapidly by Europe & Central Asia geographically, and High-Income nations economically."
        );
        d3.select("#hint").text("Hover over any line to see the series name and its 2021 value.");

        var subHeight = 170;
        var noteY = 6;   // top edge of the annotation, inside the blank headroom band

        // --- CHART 1A: REGIONAL TRENDS (TOP) ---
        var g1 = svg.append("g")
            .attr("transform", "translate(0, 15)");

        var x1 = d3.scaleLinear()
            .domain(d3.extent(data1_region, function(d) { return d.year; }))
            .range([0, width]);

        var maxY1 = d3.max(data1_region, function(d) { return d.value; });

        var y1 = d3.scaleLinear()
            .domain([0, maxY1 * headroom])
            .range([subHeight, 0]);

        var colorRegion = regionColor;

        var nestedRegion = d3.nest()
            .key(function(d) { return d.country; })
            .entries(data1_region);

        var lineGenerator1 = d3.line()
            .x(function(d) { return x1(d.year); })
            .y(function(d) { return y1(d.value); });

        // Draw lines
        g1.selectAll(".line-region")
            .data(nestedRegion)
            .enter()
            .append("path")
                .attr("class", "line-path")
                .attr("d", function(d) { return lineGenerator1(d.values); })
                .attr("stroke", function(d) { return colorRegion(d.key); })
                .attr("cursor", "pointer")
                .on("mouseover", function(d) {
                    d3.select(this).attr("stroke-width", 5);
                    var last = d.values[d.values.length - 1];
                    tooltip.html(
                        "<strong>" + d.key + "</strong><br/>" +
                        last.year + ": " + last.value.toFixed(1) + "%"
                    );
                    moveTooltip();
                    tooltip.transition().duration(100).style("opacity", 0.95);
                })
                .on("mousemove", moveTooltip)
                .on("mouseout", function() {
                    d3.select(this).attr("stroke-width", 2.5);
                    tooltip.transition().duration(200).style("opacity", 0);
                });

        // Axes
        g1.append("g")
            .attr("transform", "translate(0," + subHeight + ")")
            .call(d3.axisBottom(x1).tickFormat(d3.format("d")));

        g1.append("g")
            .call(d3.axisLeft(y1).ticks(5));

        g1.append("text")
            .attr("x", 0)
            .attr("y", -8)
            .attr("font-weight", "bold")
            .attr("font-size", "13px")
            .text("Renewable Adoption (% of Total) by Region");

        // Legend (drawn in the reserved right-hand gutter)
        var legend1 = g1.selectAll(".legend-region")
            .data(nestedRegion)
            .enter()
            .append("g")
                .attr("transform", function(d, i) {
                    return "translate(" + (width + 15) + "," + (i * 18) + ")";
                });

        legend1.append("rect")
            .attr("class", "legend-box")
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", function(d) { return colorRegion(d.key); });

        legend1.append("text")
            .attr("x", 14)
            .attr("y", 9)
            .attr("font-size", "10px")
            .text(function(d) { return shortName(d.key); });

        // ANNOTATION 1A - anchored on the 2021 Europe & Central Asia point,
        // with the note parked in the blank band above every line.
        var euro2021 = 17.16;
        var anchorY1A = y1(euro2021);

        var annotations1A = [
            {
                note: {
                    label: "Europe & Central Asia leads, at 17.2% in 2021.",
                    title: "Regional Leader",
                    wrap: 175,
                    padding: 8
                },
                x: x1(2021),
                y: anchorY1A,
                dx: 410 - x1(2021),
                dy: noteY - anchorY1A
            }
        ];

        drawAnnotation(g1, annotations1A);

        // --- CHART 1B: INCOME GROUP TRENDS (BOTTOM) ---
        var g2 = svg.append("g")
            .attr("transform", "translate(0, 275)");

        var x2 = d3.scaleLinear()
            .domain(d3.extent(data1_income, function(d) { return d.year; }))
            .range([0, width]);

        var maxY2 = d3.max(data1_income, function(d) { return d.value; });

        var y2 = d3.scaleLinear()
            .domain([0, maxY2 * headroom])
            .range([subHeight, 0]);

        var colorIncome = incomeColor;

        var nestedIncome = d3.nest()
            .key(function(d) { return d.country; })
            .entries(data1_income);

        var lineGenerator2 = d3.line()
            .x(function(d) { return x2(d.year); })
            .y(function(d) { return y2(d.value); });

        // Draw lines
        g2.selectAll(".line-income")
            .data(nestedIncome)
            .enter()
            .append("path")
                .attr("class", "line-path")
                .attr("d", function(d) { return lineGenerator2(d.values); })
                .attr("stroke", function(d) { return colorIncome(d.key); })
                .attr("cursor", "pointer")
                .on("mouseover", function(d) {
                    d3.select(this).attr("stroke-width", 5);
                    var last = d.values[d.values.length - 1];
                    tooltip.html(
                        "<strong>" + d.key + "</strong><br/>" +
                        last.year + ": " + last.value.toFixed(1) + "%"
                    );
                    moveTooltip();
                    tooltip.transition().duration(100).style("opacity", 0.95);
                })
                .on("mousemove", moveTooltip)
                .on("mouseout", function() {
                    d3.select(this).attr("stroke-width", 2.5);
                    tooltip.transition().duration(200).style("opacity", 0);
                });

        // Axes
        g2.append("g")
            .attr("transform", "translate(0," + subHeight + ")")
            .call(d3.axisBottom(x2).tickFormat(d3.format("d")));

        g2.append("g")
            .call(d3.axisLeft(y2).ticks(5));

        g2.append("text")
            .attr("x", 0)
            .attr("y", -8)
            .attr("font-weight", "bold")
            .attr("font-size", "13px")
            .text("Renewable Adoption (% of Total) by Income Group");

        // Legend (same reserved gutter, same offsets as Chart 1A)
        var legend2 = g2.selectAll(".legend-income")
            .data(nestedIncome)
            .enter()
            .append("g")
                .attr("transform", function(d, i) {
                    return "translate(" + (width + 15) + "," + (i * 18) + ")";
                });

        legend2.append("rect")
            .attr("class", "legend-box")
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", function(d) { return colorIncome(d.key); });

        legend2.append("text")
            .attr("x", 14)
            .attr("y", 9)
            .attr("font-size", "10px")
            .text(function(d) { return d.key; });

        // ANNOTATION 1B - same template, same note position as 1A
        var high2021 = 14.09;
        var anchorY1B = y2(high2021);

        var annotations1B = [
            {
                note: {
                    label: "High-income economies exceed 14%; low-income economies stay near zero.",
                    title: "Income Gap",
                    wrap: 175,
                    padding: 8
                },
                x: x2(2021),
                y: anchorY1B,
                dx: 410 - x2(2021),
                dy: noteY - anchorY1B
            }
        ];

        drawAnnotation(g2, annotations1B);
    }

    // ==========================================
    // SCENE 2: TOP CO2 EMITTERS PER CAPITA
    // ==========================================
    function renderScene2() {
        d3.select("#scene-title").text("Scene 2: Top Countries by CO2 Emissions Per Capita (2021)");
        d3.select("#scene-description").text(
            "Per-capita carbon emissions are heavily concentrated in wealthy economies: 18 out of the top 20 emitters are High-Income nations, alongside oil-rich and small island states."
        );
        d3.select("#hint").text("Hover over any bar to see its region and income group.");

        // Sort bars descending
        data2_bars.sort(function(a, b) { return b.value - a.value; });

        var barsHeight = height - 40;   // leaves room for the axis title

        var yBars = d3.scaleBand()
            .domain(data2_bars.map(function(d) { return d.country; }))
            .range([0, barsHeight])
            .padding(0.2);

        var colorIncome = incomeColor;

        // 140px left offset holds the country name axis labels
        var g = svg.append("g")
            .attr("transform", "translate(140, 5)");

        var adjWidth = width - 140;          // 500
        var barAreaWidth = adjWidth - 60;    // 440, the extra 60 holds value labels

        var xBars = d3.scaleLinear()
            .domain([0, d3.max(data2_bars, function(d) { return d.value; })])
            .nice()
            .range([0, barAreaWidth]);

        // Draw Bars colored by Income Group
        g.selectAll(".bar")
            .data(data2_bars)
            .enter()
            .append("rect")
                .attr("class", "bar-rect")
                .attr("y", function(d) { return yBars(d.country); })
                .attr("height", yBars.bandwidth())
                .attr("x", 0)
                .attr("width", function(d) { return xBars(d.value); })
                .style("fill", function(d) {
                    return colorIncome(d.income) || "#999";
                })
                .attr("cursor", "pointer")
                .on("mouseover", function(d) {
                    d3.select(this).attr("stroke-width", 2);
                    tooltip.html(
                        "<strong>" + d.country + "</strong><br/>" +
                        "Region: " + d.region + "<br/>" +
                        "Income: " + (d.income || "n/a") + "<br/>" +
                        "CO2: " + d.value.toFixed(1) + " t/person"
                    );
                    moveTooltip();
                    tooltip.transition().duration(100).style("opacity", 0.95);
                })
                .on("mousemove", moveTooltip)
                .on("mouseout", function() {
                    d3.select(this).attr("stroke-width", 0.5);
                    tooltip.transition().duration(200).style("opacity", 0);
                });

        // Add Value Labels
        g.selectAll(".val-label")
            .data(data2_bars)
            .enter()
            .append("text")
                .attr("y", function(d) {
                    return yBars(d.country) + yBars.bandwidth() / 2 + 4;
                })
                .attr("x", function(d) { return xBars(d.value) + 5; })
                .attr("font-size", "10px")
                .text(function(d) { return d.value.toFixed(1); });

        // Axes
        g.append("g")
            .call(d3.axisLeft(yBars));

        g.append("g")
            .attr("transform", "translate(0," + barsHeight + ")")
            .call(d3.axisBottom(xBars));

        // Axis Title
        g.append("text")
            .attr("x", barAreaWidth / 2)
            .attr("y", barsHeight + 38)
            .attr("text-anchor", "middle")
            .attr("font-size", "11px")
            .text("Metric Tons CO2e Per Capita (2021)");

        // Legend for Scene 2.
        // Because the bars are sorted descending, the lower-right of the plot is
        // empty, so the legend sits there without covering any bar.
        var scene2IncomeGroups = colorIncome.domain().filter(function(group) {
            return data2_bars.some(function(d) {
                return d.income === group;
            });
        });

        var legend2 = g.selectAll(".legend-s2")
            .data(scene2IncomeGroups)
            .enter()
            .append("g")
            .attr("transform", function(d, i) {
                return "translate(300," + (barsHeight - 95 + i * 20) + ")";
            });

        legend2.append("rect")
            .attr("width", 12)
            .attr("height", 12)
            .attr("fill", function(d) { return colorIncome(d); })
            .attr("stroke", "#333");

        legend2.append("text")
            .attr("x", 18)
            .attr("y", 10)
            .attr("font-size", "11px")
            .text(function(d) { return d; });

        // ANNOTATION FOR SCENE 2 - anchored on Qatar (row 2), note dropped into
        // the empty space to the right of the short bars below it.
        var qatar = data2_bars.find(function(d) {
            return d.country === "Qatar";
        });

        var annotations2 = qatar ? [
            {
                note: {
                    label: "Qatar illustrates a broader pattern: 18 of the top 20 emitters are high-income economies.",
                    title: "Income Concentration",
                    wrap: 170,
                    padding: 8
                },
                x: xBars(qatar.value),
                y: yBars(qatar.country) + yBars.bandwidth() / 2,
                dx: 300 - xBars(qatar.value),
                dy: 95 - (yBars(qatar.country) + yBars.bandwidth() / 2)
            }
        ] : [];

        drawAnnotation(g, annotations2);
    }

    // ==========================================
    // SCENE 3: ENERGY EFFICIENCY VS. RENEWABLE YIELD
    // ==========================================
    function renderScene3() {
        d3.select("#scene-title").text("Scene 3: Energy Efficiency vs. Renewable Output (2021)");
        d3.select("#scene-description").text(
            "High renewable adoption spans across nations regardless of economic efficiency. Hover over circles to explore individual country specifics."
        );
        d3.select("#hint").text("Hover over any circle for that country's region, income group and both measures.");

        var plotHeight = height - 40;   // leaves room for the axis title

        var x3 = d3.scaleLinear()
            .domain([0, d3.max(data3_scatter, function(d) { return d.gdp_per_energy; }) * 1.05])
            .range([0, width]);

        var y3 = d3.scaleLinear()
            .domain([0, d3.max(data3_scatter, function(d) { return d.renewable_pct; }) * 1.05])
            .range([plotHeight, 0]);

        var colorRegion = regionColor;

        var g = svg.append("g")
            .attr("transform", "translate(0, 10)");

        // Draw Scatterplot Circles
        g.selectAll("circle")
            .data(data3_scatter)
            .enter()
            .append("circle")
                .attr("cx", function(d) { return x3(d.gdp_per_energy); })
                .attr("cy", function(d) { return y3(d.renewable_pct); })
                .attr("r", 6)
                .attr("fill", function(d) { return colorRegion(d.region); })
                .attr("stroke", "black")
                .attr("opacity", 0.75)
                .attr("cursor", "pointer")
                // TOOLTIP MOUSE EVENTS
                .on("mouseover", function(d) {
                    d3.select(this)
                        .attr("r", 10)
                        .attr("opacity", 1);

                    tooltip.html(
                        "<strong>" + d.country + "</strong><br/>" +
                        "Region: " + d.region + "<br/>" +
                        "Income: " + (d.income || "n/a") + "<br/>" +
                        "Renewables: " + d.renewable_pct.toFixed(1) + "%<br/>" +
                        "GDP / Energy: $" + d.gdp_per_energy.toFixed(1)
                    );
                    moveTooltip();
                    tooltip.transition().duration(100).style("opacity", 0.95);
                })
                .on("mousemove", moveTooltip)
                .on("mouseout", function() {
                    d3.select(this)
                        .attr("r", 6)
                        .attr("opacity", 0.75);

                    tooltip.transition().duration(200).style("opacity", 0);
                });

        // Axes
        g.append("g")
            .attr("transform", "translate(0," + plotHeight + ")")
            .call(d3.axisBottom(x3));

        g.append("g")
            .call(d3.axisLeft(y3));

        // Axis Labels
        g.append("text")
            .attr("x", width / 2)
            .attr("y", plotHeight + 38)
            .attr("text-anchor", "middle")
            .attr("font-size", "11px")
            .text("GDP Per Unit of Energy Use (PPP 2021 $)");

        g.append("text")
            .attr("transform", "rotate(-90)")
            .attr("x", -plotHeight / 2)
            .attr("y", -40)
            .attr("text-anchor", "middle")
            .attr("font-size", "11px")
            .text("Renewable Electricity Output (% of total)");

        // Legend for Regions in Scene 3.
        // Built from the data in first-seen order and drawn in the reserved
        // right-hand gutter, matching Scene 1.
        var regions = [];
        data3_scatter.forEach(function(d) {
            if (regions.indexOf(d.region) === -1) {
                regions.push(d.region);
            }
        });

        var legend = g.selectAll(".legend-scatter")
            .data(regions)
            .enter()
            .append("g")
                .attr("transform", function(d, i) {
                    return "translate(" + (width + 20) + "," + (i * 18) + ")";
                });

        legend.append("rect")
            .attr("class", "legend-box")
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", function(d) { return colorRegion(d); });

        legend.append("text")
            .attr("x", 14)
            .attr("y", 9)
            .attr("font-size", "10px")
            .text(function(d) { return shortName(d); });

        // ANNOTATION FOR SCENE 3 - anchored on Ireland (far right), note placed
        // in the empty upper-middle area where no country plots.
        var ireland = data3_scatter.find(function(d) {
            return d.country === "Ireland";
        });

        var annotations3 = ireland ? [
            {
                note: {
                    label: "Ireland combines the highest economic energy efficiency with substantial renewable output.",
                    title: "Different Pathways",
                    wrap: 160,
                    padding: 8
                },
                x: x3(ireland.gdp_per_energy),
                y: y3(ireland.renewable_pct),
                dx: 400 - x3(ireland.gdp_per_energy),
                dy: 45 - y3(ireland.renewable_pct)
            }
        ] : [];

        drawAnnotation(g, annotations3);
    }
</script>

</body>
</html>
