<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Global Energy & Climate Pivot</title>

    <!-- D3 Library (v5) -->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <!-- d3-annotation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        #container {
            width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .nav-buttons {
            margin: 20px 0;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 5px;
            background: #e0e0e0;
            border: 1px solid #999;
            border-radius: 4px;
        }
        button.active {
            background: #007bff;
            color: white;
            border-color: #0056b3;
            font-weight: bold;
        }
        #chart-container {
            width: 860px;
            height: 540px;
            position: relative;
        }
        /* Style for SVG Elements */
        path.line-path {
            fill: none !important;
            stroke-width: 2.5px;
        }
        .legend-box {
            stroke: none !important;
        }
        .bar-rect {
            stroke: #333;
            stroke-width: 0.5px;
        }
        .annotation-group .annotation-note-label {
            font-size: 10px;
            line-height: 1.25;
        }
        .annotation-group .annotation-note-title {
            font-size: 11px;
            font-weight: bold;
        }
        .annotation-group .annotation-note-bg {
            fill: white;
            fill-opacity: 0.92;
        }
        .annotation-group .connector {
            stroke: #444;
            stroke-width: 1.25px;
            stroke-dasharray: 3, 3;
        }

        .annotation-group .annotation-subject {
            stroke: #444;
        }
        circle {
            stroke: black;
            opacity: 0.8;
        }
        /* Simple Tooltip Styling for Scene 3 */
        .tooltip {
            position: absolute;
            padding: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>

<body onload="init()">
<div id="container">
    <h1 id="scene-title">The Global Energy & Climate Pivot</h1>
    <p id="scene-description">Loading project data...</p>

    <!-- Triggers (Navigation Buttons) -->
    <div class="nav-buttons">
        <button id="btn-1" class="active" onclick="goToScene(1)">1. Renewable Trends</button>
        <button id="btn-2" onclick="goToScene(2)">2. CO2 Emissions Leaders</button>
        <button id="btn-3" onclick="goToScene(3)">3. Efficiency vs. Renewables</button>
    </div>
    <!-- Chart SVG Container -->
    <div id="chart-container">
        <div id="tooltip" class="tooltip"></div>
    </div>
</div>

<script>
    // PARAMETERS (State Variables)
    var currentScene = 1;

    // Data Storage Variables
    var data1_region = [];
    var data1_income = [];
    var data2_bars = [];
    var data3_scatter = [];

    // Main SVG Canvas & Dimensions
    var margin = {top: 30, right: 180, bottom: 50, left: 60};
    var width = 860 - margin.left - margin.right;
    var height = 540 - margin.top - margin.bottom;

    var svg = d3.select("#chart-container")
        .append("svg")
            .attr("width", 860)
            .attr("height", 540)
        .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var tooltip = d3.select("#tooltip");

    // HELPER FUNCTION: Safely reads object properties ignoring hidden BOM characters
    function getVal(d, keyName) {
        var keys = Object.keys(d);
        for (var i = 0; i < keys.length; i++) {
            if (keys[i].trim().replace(/^\ufeff/, "") === keyName) {
                return d[keys[i]];
            }
        }
        return d[keyName];
    }

    // INITIALIZATION FUNCTION: Loads CSV files safely
    async function init() {
        data1_region = await d3.csv("scene1_lines1.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                year: +getVal(d, "Year"),
                value: +getVal(d, "renewable_pct")
            };
        });

        data1_income = await d3.csv("scene1_lines2.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                year: +getVal(d, "Year"),
                value: +getVal(d, "renewable_pct")
            };
        });

        data2_bars = await d3.csv("scene2_bars.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                value: +getVal(d, "Value"),
                region: getVal(d, "Region"),
                income: (getVal(d, "Income Group") || "").trim()
            };
        });

        data3_scatter = await d3.csv("scene3_scatter.csv", function(d) {
            return {
                country: getVal(d, "Country Name"),
                year: +getVal(d, "Year"),
                renewable_pct: Math.max(0, +getVal(d, "renewable_pct")),
                gdp_per_energy: +getVal(d, "gdp_per_energy"),
                region: getVal(d, "Region"),
                income: getVal(d, "Income Group")
            };
        });

        renderScene();
    }

    // TRIGGER FUNCTION: Updates parameter & UI state
    function goToScene(sceneNumber) {
        currentScene = sceneNumber;

        d3.selectAll(".nav-buttons button").classed("active", false);
        d3.select("#btn-" + sceneNumber).classed("active", true);

        renderScene();
    }

    // MAIN CONTROLLER FUNCTION
    function renderScene() {
        svg.selectAll("*").remove();

        if (currentScene === 1) {
            renderScene1();
        } else if (currentScene === 2) {
            renderScene2();
        } else if (currentScene === 3) {
            renderScene3();
        }
    }

    // ==========================================
    // SCENE 1: RENEWABLE ADOPTION TRENDS
    // ==========================================
    function renderScene1() {
        d3.select("#scene-title").text("Scene 1: Renewable Electricity Adoption (1990–2021)");
        d3.select("#scene-description").text(
            "Global renewable energy adoption (excluding hydro) has expanded significantly, led rapidly by Europe & Central Asia geographically, and High-Income nations economically."
        );

        var subHeight = 160;

        // --- CHART 1A: REGIONAL TRENDS (TOP) ---
        var g1 = svg.append("g")
            .attr("transform", "translate(0, 10)");

        var x1 = d3.scaleLinear()
            .domain(d3.extent(data1_region, function(d) { return d.year; }))
            .range([0, width]);

        var maxY1 = d3.max(data1_region, function(d) { return d.value; });

        var y1 = d3.scaleLinear()
            .domain([0, maxY1])
            .range([subHeight, 0]);

        var colorRegion = d3.scaleOrdinal(d3.schemeCategory10);

        var nestedRegion = d3.nest()
            .key(function(d) { return d.country; })
            .entries(data1_region);

        var lineGenerator1 = d3.line()
            .x(function(d) { return x1(d.year); })
            .y(function(d) { return y1(d.value); });

        // Draw lines
        g1.selectAll(".line-region")
            .data(nestedRegion)
            .enter()
            .append("path")
                .attr("class", "line-path")
                .attr("d", function(d) { return lineGenerator1(d.values); })
                .attr("stroke", function(d) { return colorRegion(d.key); });

        // Axes
        g1.append("g")
            .attr("transform", "translate(0," + subHeight + ")")
            .call(d3.axisBottom(x1).tickFormat(d3.format("d")));

        g1.append("g")
            .call(d3.axisLeft(y1).ticks(5));

        g1.append("text")
            .attr("x", 0)
            .attr("y", -8)
            .attr("font-weight", "bold")
            .attr("font-size", "13px")
            .text("Renewable Adoption (% of Total) by Region");

        // Legend
        var legend1 = g1.selectAll(".legend-region")
            .data(nestedRegion)
            .enter()
            .append("g")
                .attr("transform", function(d, i) {
                    return "translate(" + (width + 10) + "," + (i * 18) + ")";
                });

        legend1.append("rect")
            .attr("class", "legend-box")
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", function(d) { return colorRegion(d.key); });

        legend1.append("text")
            .attr("x", 14)
            .attr("y", 9)
            .attr("font-size", "10px")
            .text(function(d) { return d.key; });

        // ANNOTATION 1A
        var annotations1A = [
            {
                note: {
                    label: "Europe & Central Asia leads regional adoption, reaching about 17.3% in 2021.",
                    title: "Regional Leader",
                    wrap: 145,
                    padding: 8
                },
                x: x1(2021),
                y: y1(17.3),
                dx: -175,
                dy: 75
            }
        ];

        var makeAnnotations1A = d3.annotation()
            .type(d3.annotationCalloutElbow)
            .annotations(annotations1A);

        g1.append("g")
            .attr("class", "annotation-group")
            .call(makeAnnotations1A);

        // --- CHART 1B: INCOME GROUP TRENDS (BOTTOM) ---
        var g2 = svg.append("g")
            .attr("transform", "translate(0, 240)");

        var x2 = d3.scaleLinear()
            .domain(d3.extent(data1_income, function(d) { return d.year; }))
            .range([0, width]);

        var maxY2 = d3.max(data1_income, function(d) { return d.value; });

        var y2 = d3.scaleLinear()
            .domain([0, maxY2])
            .range([subHeight, 0]);

        var colorIncome = d3.scaleOrdinal()
            .range(["#d95f02", "#7570b3", "#e7298a", "#66a61e"]);

        var nestedIncome = d3.nest()
            .key(function(d) { return d.country; })
            .entries(data1_income);

        var lineGenerator2 = d3.line()
            .x(function(d) { return x2(d.year); })
            .y(function(d) { return y2(d.value); });

        // Draw lines
        g2.selectAll(".line-income")
            .data(nestedIncome)
            .enter()
            .append("path")
                .attr("class", "line-path")
                .attr("d", function(d) { return lineGenerator2(d.values); })
                .attr("stroke", function(d) { return colorIncome(d.key); });

        // Axes
        g2.append("g")
            .attr("transform", "translate(0," + subHeight + ")")
            .call(d3.axisBottom(x2).tickFormat(d3.format("d")));

        g2.append("g")
            .call(d3.axisLeft(y2).ticks(5));

        g2.append("text")
            .attr("x", 0)
            .attr("y", -8)
            .attr("font-weight", "bold")
            .attr("font-size", "13px")
            .text("Renewable Adoption (% of Total) by Income Group");

        // Legend
        var legend2 = g2.selectAll(".legend-income")
            .data(nestedIncome)
            .enter()
            .append("g")
                .attr("transform", function(d, i) {
                    return "translate(" + (width + 10) + "," + (i * 18) + ")";
                });

        legend2.append("rect")
            .attr("class", "legend-box")
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", function(d) { return colorIncome(d.key); });

        legend2.append("text")
            .attr("x", 14)
            .attr("y", 9)
            .attr("font-size", "10px")
            .text(function(d) { return d.key; });

        // ANNOTATION 1B
        var annotations1B = [
            {
                note: {
                    label: "High-income economies exceed 14%, while low-income economies remain near zero.",
                title: "Income Gap",
                wrap: 140,
                padding: 8
                },
                x: x2(2021),
                y: y2(14.0),
                dx: -175,
                dy: 65
            }
        ];

        var makeAnnotations1B = d3.annotation()
            .type(d3.annotationCalloutElbow)
            .annotations(annotations1B);

        g2.append("g")
            .attr("class", "annotation-group")
            .call(makeAnnotations1B);
    }

    // ==========================================
    // SCENE 2: TOP CO2 EMITTERS PER CAPITA
    // ==========================================
    function renderScene2() {
        d3.select("#scene-title").text("Scene 2: Top Countries by CO2 Emissions Per Capita (2021)");
        d3.select("#scene-description").text(
            "Per-capita carbon emissions are heavily concentrated in wealthy economies: 18 out of the top 20 emitters are High-Income nations, alongside oil-rich and small island states."
        );

        // Sort bars descending
        data2_bars.sort(function(a, b) { return b.value - a.value; });

        var y2 = d3.scaleBand()
            .domain(data2_bars.map(function(d) { return d.country; }))
            .range([0, height])
            .padding(0.2);

        var colorIncome = d3.scaleOrdinal()
            .domain([
                "High income",
                "Upper middle income",
                "Lower middle income",
                "Low income"
            ])
            .range([
                "#2f6f9f",
                "#e28e2c",
                "#59a14f",
                "#b07aa1"
            ]);

        var g = svg.append("g")
            .attr("transform", "translate(120, 10)");

        var adjWidth = width - 120;
        var barAreaWidth = adjWidth - 45;

        var x2 = d3.scaleLinear()
            .domain([0, d3.max(data2_bars, function(d) { return d.value; })])
            .nice()
            .range([0, barAreaWidth]);

        // Draw Bars colored by Income Group
        g.selectAll(".bar")
            .data(data2_bars)
            .enter()
            .append("rect")
                .attr("class", "bar-rect")
                .attr("y", function(d) { return y2(d.country); })
                .attr("height", y2.bandwidth())
                .attr("x", 0)
                .attr("width", function(d) { return x2(d.value); })
                .style("fill", function(d) {
                    return colorIncome(d.income) || "#999";
                });

        // Add Value Labels
        g.selectAll(".val-label")
            .data(data2_bars)
            .enter()
            .append("text")
                .attr("y", function(d) {
                    return y2(d.country) + y2.bandwidth() / 2 + 4;
                })
                .attr("x", function(d) { return x2(d.value) + 5; })
                .attr("font-size", "10px")
                .text(function(d) { return d.value.toFixed(1); });

        // Axes
        g.append("g")
            .call(d3.axisLeft(y2));

        g.append("g")
            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(x2));

        // Axis Title
        g.append("text")
            .attr("x", adjWidth / 2)
            .attr("y", height + 38)
            .attr("text-anchor", "middle")
            .attr("font-size", "11px")
            .text("Metric Tons CO2e Per Capita (2021)");

        // Legend for Scene 2
        var scene2IncomeGroups = colorIncome.domain().filter(function(group) {
            return data2_bars.some(function(d) {
                return d.income === group;
            });
        });

        var legend2 = g.selectAll(".legend-s2")
            .data(scene2IncomeGroups)
            .enter()
            .append("g")
            .attr("transform", function(d, i) {
                return "translate(" + (adjWidth + 15) + "," + (height - 65 + i * 20) + ")";
            });

        legend2.append("rect")
            .attr("width", 12)
            .attr("height", 12)
            .attr("fill", function(d) { return colorIncome(d); })
            .attr("stroke", "#333");

        legend2.append("text")
            .attr("x", 18)
            .attr("y", 10)
            .attr("font-size", "11px")
            .text(function(d) { return d; });

        // ANNOTATION FOR SCENE 2
        var qatar = data2_bars.find(function(d) {
            return d.country === "Qatar";
        });

        var annotationPanelX = adjWidth + 15;

        var annotations2 = qatar ? [
            {
                note: {
                    label: "Qatar illustrates a broader pattern: 18 of the top 20 emitters are high-income economies.",
                    title: "Income Concentration",
                    wrap: 145,
                    padding: 8
                },
                x: x2(qatar.value),
            y: y2(qatar.country) + y2.bandwidth() / 2,
            dx: annotationPanelX - x2(qatar.value),
            dy: 35
            }
        ] : [];

        var makeAnnotations2 = d3.annotation()
            .type(d3.annotationCalloutElbow)
            .annotations(annotations2);

        g.append("g")
            .attr("class", "annotation-group")
            .call(makeAnnotations2);
    }

    // ==========================================
    // SCENE 3: ENERGY EFFICIENCY VS. RENEWABLE YIELD
    // ==========================================
    function renderScene3() {
        d3.select("#scene-title").text("Scene 3: Energy Efficiency vs. Renewable Output (2021)");
        d3.select("#scene-description").text(
            "High renewable adoption spans across nations regardless of economic efficiency. Hover over circles to explore individual country specifics."
        );

        var x3 = d3.scaleLinear()
            .domain([0, d3.max(data3_scatter, function(d) { return d.gdp_per_energy; }) * 1.05])
            .range([0, width]);

        var y3 = d3.scaleLinear()
            .domain([0, d3.max(data3_scatter, function(d) { return d.renewable_pct; }) * 1.05])
            .range([height - 20, 0]);

        var colorRegion = d3.scaleOrdinal(d3.schemeCategory10);

        var g = svg.append("g")
            .attr("transform", "translate(10, 10)");

        // Draw Scatterplot Circles
        g.selectAll("circle")
            .data(data3_scatter)
            .enter()
            .append("circle")
                .attr("cx", function(d) { return x3(d.gdp_per_energy); })
                .attr("cy", function(d) { return y3(d.renewable_pct); })
                .attr("r", 6)
                .attr("fill", function(d) { return colorRegion(d.region); })
                .attr("stroke", "black")
                .attr("opacity", 0.75)
                // TOOLTIP MOUSE EVENTS
                .on("mouseover", function(d) {
                    d3.select(this)
                        .attr("r", 10)
                        .attr("opacity", 1);

                    tooltip.transition()
                        .duration(100)
                        .style("opacity", 0.95);

                    tooltip.html(
                        "<strong>" + d.country + "</strong><br/>" +
                        "Region: " + d.region + "<br/>" +
                        "Income: " + d.income + "<br/>" +
                        "Renewables: " + d.renewable_pct.toFixed(1) + "%<br/>" +
                        "GDP / Energy: $" + d.gdp_per_energy.toFixed(1)
                    )
                    .style("left", (d3.event.offsetX + 15) + "px")
                    .style("top", (d3.event.offsetY - 35) + "px");
                })
                .attr("cursor", "pointer")
                .on("mouseout", function() {
                    d3.select(this)
                        .attr("r", 6)
                        .attr("opacity", 0.75);

                    tooltip.transition()
                        .duration(200)
                        .style("opacity", 0);
                });

        // Axes
        g.append("g")
            .attr("transform", "translate(0," + (height - 20) + ")")
            .call(d3.axisBottom(x3));

        g.append("g")
            .call(d3.axisLeft(y3));

        // Axis Labels
        g.append("text")
            .attr("x", width / 2)
            .attr("y", height + 20)
            .attr("text-anchor", "middle")
            .attr("font-size", "11px")
            .text("GDP Per Unit of Energy Use (PPP 2021 $)");

        g.append("text")
            .attr("transform", "rotate(-90)")
            .attr("x", -height / 2)
            .attr("y", -40)
            .attr("text-anchor", "middle")
            .attr("font-size", "11px")
            .text("Renewable Electricity Output (% of total)");

        // Legend for Regions in Scene 3
        var regions = colorRegion.domain();

        var legend = g.selectAll(".legend-scatter")
            .data(regions)
            .enter()
            .append("g")
                .attr("transform", function(d, i) {
                    return "translate(" + (width - 150) + "," + (i * 18 + 10) + ")";
                });

        legend.append("rect")
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", function(d) { return colorRegion(d); });

        legend.append("text")
            .attr("x", 14)
            .attr("y", 9)
            .attr("font-size", "10px")
            .text(function(d) { return d; });

        // ANNOTATION FOR SCENE 3
        var ireland = data3_scatter.find(function(d) {
            return d.country === "Ireland";
        });

        var annotations3 = ireland ? [
            {
                note: {
                    label: "Ireland combines high economic energy efficiency with substantial renewable output.",
                    title: "Different Pathways",
                    wrap: 125,
                    padding: 8
                },
                x: x3(ireland.gdp_per_energy),
                y: y3(ireland.renewable_pct),
                dx: 35,
                dy: 60
            }
        ] : [];

        var makeAnnotations3 = d3.annotation()
            .type(d3.annotationCalloutElbow)
            .annotations(annotations3);

        g.append("g")
            .attr("class", "annotation-group")
            .call(makeAnnotations3);
    }
</script>

</body>
</html>
